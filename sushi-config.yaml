id: nictiz.fhir.nl.r4.acutezorg
canonical: http://nictiz.nl/fhir
name: AcuteZorg
title: "Acute Zorg"
status: draft
version: 0.1.0-alpha.1
fhirVersion: 4.0.1
copyrightYear: 2026+
# CC0 across the whole IG: sets ImplementationGuide.license and renders the CC0 waiver in the
# footer. Individual conformance resources (e.g. the CapabilityStatements) also carry an explicit
# CC0 copyright statement.
license: CC0-1.0
releaseLabel: qa-preview
publisher:
  name: Nictiz
  url: http://nictiz.nl
description: "FHIR R4 Implementation Guide for information exchange in acute care settings in the Netherlands (Acute Zorg), built on nl-core. The first use case is the Ambulanceverwijzing naar HAP (ambulance to GP out-of-hours post, AMB naar HAP)."
menu:
  Home: index.html
  Background:
    Use cases: use-cases.html
    Functional design: functional-design.html
    Dependencies: dependencies.html
  Specification:
    Data model: data-model.html
    Data exchange: data-exchange.html
    Workflow: workflow.html
    Design decisions: design-decisions.html
  Project:
    Open items: open-items.html
    Changelog: changelog.html
  Testing: testing.html
  Artifacts: artifacts.html
# Explicit page order so the IG page numbering follows the menu, not the default
# alphabetical-by-filename order (which put use-cases.md last).
pages:
  index.md:
    title: Home
  use-cases.md:
    title: Use cases
  functional-design.md:
    title: Functional design
  dependencies.md:
    title: Dependencies
  data-model.md:
    title: Data model
  data-exchange.md:
    title: Data exchange
  workflow.md:
    title: Workflow
  design-decisions.md:
    title: Design decisions
  open-items.md:
    title: Open items
  changelog.md:
    title: Changelog
  testing.md:
    title: Testing
dependencies:
  nictiz.fhir.nl.r4.nl-core: 0.12.0-beta.4
  nictiz.fhir.nl.r4.zib2020: 0.12.0-beta.4
  hl7.fhir.uv.tools.r4: 1.1.2
FSHOnly: false
applyExtensionMetadataToRoot: false
parameters:
  show-inherited-invariants: false
  excludettl: true
  # Validate SNOMED CT against the Netherlands edition (module 11000146104) so NL-edition
  # codes such as 11131000146102 resolve on tx.fhir.org instead of the International edition.
  # The edition/version is set in the referenced expansion Parameters resource.
  path-expansion-params: '../../expansion-params.json'
  # The acutezorg-codesysteem-16 code system and the Bijlagen value set are embedded verbatim as
  # ART-DECOR FHIR exports (input/resources). They keep their source canonicals (urn:oid:... for the
  # code system, the decor.nictiz.nl URL for the value set) instead of the IG's http://nictiz.nl/fhir
  # base. Registering those canonicals as special-url tells the IG Publisher the mismatch is
  # intentional, and lets instances carrying system = urn:oid:...55.5.16 validate.
  special-url:
    - urn:oid:2.16.840.1.113883.2.4.3.11.60.55.5.16
    - http://decor.nictiz.nl/fhir/ValueSet/2.16.840.1.113883.2.4.3.11.60.103.11.31--20250820144948
instanceOptions:
  manualSliceOrdering: true